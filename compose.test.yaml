# Isolated fault-injection replica set. Never use this service for application data.
services:
  mongo_faults:
    profiles: [faults]
    image: mongo:8.0@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--setParameter", "enableTestCommands=1", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27028:27017"
    tmpfs:
      - /data/db
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          'try { rs.status(); } catch(e) { if(e.code === 94) rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}); else throw e; } quit(db.hello().isWritablePrimary ? 0 : 1);'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
